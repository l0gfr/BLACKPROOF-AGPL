packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 1440
blockExoticSubdeps: true
packageManagerStrictVersion: true
strictDepBuilds: true

overrides:
  "@types/hast": "3.0.4"
  "@xmldom/xmldom": "0.9.12"
  fast-uri: "3.1.6"
  js-yaml: "4.3.2"
  postcss: "8.5.26"
  sharp: "0.35.4"
  svgo: "4.1.0"
  vite: "8.2.1"

allowBuilds:
  esbuild: true
  sharp: true
