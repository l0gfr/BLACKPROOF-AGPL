packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAge: 1440
blockExoticSubdeps: true
packageManagerStrictVersion: true
strictDepBuilds: true

# Reviewed 2026-11-14: deepmerge has no patched release for this GHSA.
# Its only caller here is vite-plugin-svelte merging trusted build config;
# CVE-2026-93753 was rejected. Remove this exception when upstream resolves it.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4

overrides:
  "@types/hast": "3.0.4"
  "@xmldom/xmldom": "0.9.12"
  devalue: "5.9.3"
  fast-uri: "3.1.9"
  http-cache-semantics: "4.3.0"
  js-yaml: "4.3.2"
  postcss: "8.5.26"
  sharp: "0.35.5"
  smol-toml: "1.9.1"
  source-map-js: "1.2.2"
  svgo: "4.1.0"
  vite: "8.3.5"
  undici: "8.12.2"
  zod: "4.6.7"

allowBuilds:
  esbuild: true
  sharp: true
