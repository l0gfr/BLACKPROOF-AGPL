    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#8ee5d1" stroke-opacity=".055" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#background)" />
