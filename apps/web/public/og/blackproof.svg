<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">BLACKPROOF</title>
  <desc id="description">Questionnaires cyber clients, données locales par défaut</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="40" x2="1110" y2="600" gradientUnits="userSpaceOnUse">
